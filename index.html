<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Officina Mappe</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<svg id="cv" aria-label="Mappa mentale"><g id="vp"></g></svg>

<header class="bar">
  <span class="brand"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="4" fill="var(--accent)"/><circle cx="3" cy="4" r="2.2" fill="var(--c1)"/><circle cx="19" cy="5" r="2.2" fill="var(--c2)"/><circle cx="18" cy="18" r="2.2" fill="var(--c3)"/><path d="M4.6 5.4 8 8.6M17.4 6.2 14 8.8M16.5 16.6 13.8 13.6" stroke="var(--muted)" stroke-width="1.4" stroke-linecap="round"/></svg>Officina Mappe</span>
  <input id="pName" aria-label="Nome del progetto" spellcheck="false">
  <div class="dd"><button class="bb" id="bProj" aria-haspopup="true" aria-controls="mProj" aria-expanded="false">Progetti ▾</button><div class="menu ddm" id="mProj" hidden></div></div>
  <button class="bb" id="bSave" title="Ctrl+S">Salva</button>
  <div class="dd"><button class="bb" id="bExp" aria-haspopup="true" aria-controls="mExp" aria-expanded="false">Esporta ▾</button><div class="menu ddm" id="mExp" hidden></div></div>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</header>

<div class="marquee" id="box" hidden></div>
<textarea id="ed" aria-label="Testo" spellcheck="false" hidden></textarea>
<div class="menu" id="menu" role="menu" hidden></div>
<div class="preview" id="preview" hidden></div>
<div class="hint" id="hint">Tasto destro: opzioni · Trascina sullo sfondo per selezionare · Spazio + trascina o rotellina per spostarti · Doppio clic: scrivi (su un collegamento: nota)</div>
<div class="toast" id="toast" hidden></div>

<script src="js/core.js"></script>
<script src="js/storage.js"></script>
<script src="js/view.js"></script>
<script src="js/mind.js"></script>
<script src="js/editor.js"></script>
<script src="js/interactions.js"></script>
<script src="js/menu.js"></script>
<script src="js/menubar.js"></script>
<script src="js/export.js"></script>
<script src="js/main.js"></script>
</body>
</html>
