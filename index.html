<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Officina Mappe</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<svg id="cv" aria-label="Mappa mentale"><g id="vp"></g><g id="lg"></g></svg>

<header class="bar">
  <span class="brand"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="4" fill="var(--accent)"/><circle cx="3" cy="4" r="2.2" fill="var(--c1)"/><circle cx="19" cy="5" r="2.2" fill="var(--c2)"/><circle cx="18" cy="18" r="2.2" fill="var(--c3)"/><path d="M4.6 5.4 8 8.6M17.4 6.2 14 8.8M16.5 16.6 13.8 13.6" stroke="var(--muted)" stroke-width="1.4" stroke-linecap="round"/></svg>Officina Mappe</span>
  <div class="dd"><button class="bb" id="bProj" aria-haspopup="true" aria-controls="mProj" aria-expanded="false">Progetti ▾</button><div class="menu ddm" id="mProj" hidden></div></div>
  <div class="dd"><button class="bb" id="bExp" aria-haspopup="true" aria-controls="mExp" aria-expanded="false">Esporta ▾</button><div class="menu ddm" id="mExp" hidden></div></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Progetti aperti"></div>
  <button class="tadd" id="tAdd" title="Nuovo progetto in una nuova scheda" aria-label="Nuovo progetto">+</button>
  <input id="pName" aria-label="Nome del progetto" spellcheck="false">
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</header>

<div class="marquee" id="box" hidden></div>
<textarea id="ed" aria-label="Testo" spellcheck="false" hidden></textarea>
<div class="menu" id="menu" role="menu" hidden></div>
<div class="find" id="find" role="search" hidden><input id="findIn" type="search" placeholder="Cerca nella mappa" aria-label="Cerca nella mappa" spellcheck="false" autocomplete="off"><span class="fcnt" id="findCnt" aria-live="polite"></span><button class="fb" id="findPrev" title="Precedente (Maiusc+Invio)" aria-label="Risultato precedente">↑</button><button class="fb" id="findNext" title="Successivo (Invio)" aria-label="Risultato successivo">↓</button><button class="fb" id="findX" title="Chiudi (Esc)" aria-label="Chiudi la ricerca">✕</button></div>
<div class="hint" id="hint">Tasto destro: opzioni · Ctrl+F: cerca · Doppio clic: scrivi (su un collegamento: nota) · Tab: nuovo ramo · Invio: blocco accanto · Frecce: blocco vicino · Trascina sullo sfondo: seleziona · Rotellina o Spazio + trascina: sposta la vista · Ctrl + rotellina: zoom</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/core.js"></script>
<script src="js/storage.js"></script>
<script src="js/view.js"></script>
<script src="js/mind.js"></script>
<script src="js/legend.js"></script>
<script src="js/editor.js"></script>
<script src="js/interactions.js"></script>
<script src="js/menu.js"></script>
<script src="js/files.js"></script>
<script src="js/menubar.js"></script>
<script src="js/find.js"></script>
<script src="js/export.js"></script>
<script src="js/main.js"></script>
</body>
</html>
